<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Giriş / Qeydiyyat — Dolab.az</title>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/shared.css"/>
  <style>
    nav { justify-content:space-between; }
    .nav-back { font-family:inherit; font-size:13.5px; font-weight:300; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:6px; transition:color 0.15s; }
    .nav-back:hover { color:var(--navy); }
    .auth-page { min-height:calc(100vh - 68px); display:flex; align-items:center; justify-content:center; padding:48px 2rem; }
    .auth-card { background:var(--white); border:1px solid var(--border); border-radius:20px; width:100%; max-width:440px; padding:44px 48px; box-shadow:0 8px 40px rgba(0,0,0,0.07); }
    .card-logo { display:flex; justify-content:center; margin-bottom:28px; }
    .card-logo img { height:80px; width:auto; object-fit:contain; mix-blend-mode:multiply; }
    .auth-tabs { display:flex; background:var(--cream2); border-radius:10px; padding:4px; margin-bottom:32px; gap:4px; }
    .auth-tab { flex:1; font-family:inherit; font-size:14px; font-weight:300; color:var(--muted); background:none; border:none; border-radius:8px; padding:10px; cursor:pointer; transition:all 0.18s; text-align:center; }
    .auth-tab.active { background:var(--white); color:var(--navy); font-weight:400; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:12.5px; font-weight:400; color:var(--navy); margin-bottom:7px; letter-spacing:0.02em; }
    .form-input { width:100%; font-family:inherit; font-size:14px; font-weight:300; color:var(--navy); background:var(--cream2); border:1.5px solid var(--border); border-radius:9px; padding:12px 14px; outline:none; transition:border-color 0.18s,background 0.18s; }
    .form-input:focus { border-color:var(--olive); background:var(--white); box-shadow:0 0 0 3px rgba(107,124,74,0.08); }
    .form-input::placeholder { color:var(--muted); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .input-wrap { position:relative; }
    .input-wrap .form-input { padding-right:42px; }
    .eye-btn { position:absolute; right:13px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; color:var(--muted); padding:0; }
    .forgot-link { display:block; text-align:right; font-size:13px; color:var(--olive); text-decoration:none; margin-top:-10px; margin-bottom:20px; }
    .forgot-link:hover { text-decoration:underline; }
    .form-check { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--muted); line-height:1.5; }
    .form-check input[type="checkbox"] { accent-color:var(--olive); width:15px; height:15px; margin-top:2px; flex-shrink:0; cursor:pointer; }
    .form-check a { color:var(--olive); text-decoration:none; }
    .btn-submit { width:100%; font-family:inherit; font-size:16px; font-weight:400; color:var(--white); background:var(--olive); border:none; border-radius:10px; padding:14px; cursor:pointer; margin-top:8px; transition:background 0.18s; }
    .btn-submit:hover { background:var(--olive-dark); }
    .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }
    .divider-text { display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--muted); font-size:13px; }
    .divider-text::before,.divider-text::after { content:''; flex:1; height:1px; background:var(--border); }
    .btn-social { width:100%; font-family:inherit; font-size:14px; font-weight:300; color:var(--navy); background:var(--white); border:1.5px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.18s; margin-bottom:10px; }
    .btn-social:hover { border-color:var(--navy); }
    .alert { padding:12px 16px; border-radius:10px; font-size:13.5px; margin-bottom:16px; display:none; }
    .alert-error { background:#fff0f0; color:#d94f4f; border:1px solid rgba(217,79,79,0.2); }
    .alert-success { background:#f0faf0; color:var(--olive); border:1px solid rgba(107,124,74,0.2); }
    .pending-notice { background:var(--cream2); border:1px solid var(--border); border-radius:10px; padding:16px; font-size:13.5px; color:var(--muted); margin-top:16px; text-align:center; display:none; }
  </style>
</head>
<body>

<nav>
  <a class="logo-wrap" href="index.html">
    <img src="assets/dolablogo.png" alt="Dolab.az" style="mix-blend-mode:multiply;">
  </a>
  <a class="nav-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Ana səhifəyə qayıt
  </a>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="card-logo">
      <img src="assets/dolablogo.png" alt="Dolab.az">
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="showLogin()">Giriş</button>
      <button class="auth-tab" id="tab-register" onclick="showRegister()">Qeydiyyat</button>
    </div>

    <!-- ALERTS -->
    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <!-- LOGIN -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">E-poçt</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="siz@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Şifrə</label>
        <div class="input-wrap">
          <input class="form-input" type="password" placeholder="••••••••" id="loginPassword">
          <button class="eye-btn" onclick="togglePw('loginPassword',this)">👁</button>
        </div>
      </div>
      <a class="forgot-link" href="#" onclick="forgotPassword()">Şifrəni unutmusunuz?</a>
      <button class="btn-submit" id="loginBtn" onclick="doLogin()">Daxil ol</button>
      <div class="divider-text">və ya</div>
      <button class="btn-social" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google ilə daxil ol
      </button>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Ad</label>
          <input class="form-input" type="text" id="regFirstName" placeholder="Adınız">
        </div>
        <div class="form-group">
          <label class="form-label">Soyad</label>
          <input class="form-input" type="text" id="regLastName" placeholder="Soyadınız">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">E-poçt</label>
        <input class="form-input" type="email" id="regEmail" placeholder="siz@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Telefon</label>
        <input class="form-input" type="tel" id="regPhone" placeholder="+994 50 000 00 00">
      </div>
      <div class="form-group">
        <label class="form-label">Şifrə</label>
        <div class="input-wrap">
          <input class="form-input" type="password" placeholder="Minimum 8 simvol" id="regPassword">
          <button class="eye-btn" onclick="togglePw('regPassword',this)">👁</button>
        </div>
      </div>
      <div class="form-group">
        <div class="form-check">
          <input type="checkbox" id="terms">
          <label for="terms"><a href="privacy.html">İstifadəçi şərtlərini</a> və <a href="privacy.html">Gizlilik siyasətini</a> qəbul edirəm</label>
        </div>
      </div>
      <button class="btn-submit" id="registerBtn" onclick="doRegister()">Qeydiyyatdan keç</button>

      <div class="pending-notice" id="pendingNotice">
        ✅ Qeydiyyatınız qəbul edildi! Admin təsdiqindən sonra məhsul yerləşdirə biləcəksiniz.
        Giriş etmək üçün e-poçtunuzu yoxlayın.
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
// Artıq daxil olubsa yönləndir
(async () => {
  const user = await getCurrentUser();
  if (user) location.href = 'index.html';
})();

function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
  clearAlerts();
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  clearAlerts();
}

function togglePw(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

function showError(msg) {
  const el = document.getElementById('alertError');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('alertSuccess').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('alertSuccess');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('alertError').style.display = 'none';
}

function clearAlerts() {
  document.getElementById('alertError').style.display = 'none';
  document.getElementById('alertSuccess').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');

  if (!email || !password) { showError('E-poçt və şifrəni daxil edin.'); return; }

  btn.disabled = true;
  btn.textContent = 'Gözləyin...';

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showError('E-poçt və ya şifrə səhvdir.');
    btn.disabled = false;
    btn.textContent = 'Daxil ol';
  } else {
    location.href = 'index.html';
  }
}

async function doRegister() {
  const firstName = document.getElementById('regFirstName').value.trim();
  const lastName  = document.getElementById('regLastName').value.trim();
  const email     = document.getElementById('regEmail').value.trim();
  const phone     = document.getElementById('regPhone').value.trim();
  const password  = document.getElementById('regPassword').value;
  const terms     = document.getElementById('terms').checked;
  const btn       = document.getElementById('registerBtn');

  if (!firstName || !email || !password) { showError('Bütün məcburi sahələri doldurun.'); return; }
  if (password.length < 8) { showError('Şifrə minimum 8 simvol olmalıdır.'); return; }
  if (!terms) { showError('Şərtləri qəbul etməlisiniz.'); return; }

  btn.disabled = true;
  btn.textContent = 'Qeydiyyat...';

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name: firstName + ' ' + lastName,
        phone
      }
    }
  });

  if (error) {
    showError(error.message === 'User already registered'
      ? 'Bu e-poçt artıq qeydiyyatdan keçib.'
      : 'Xəta baş verdi. Yenidən cəhd edin.');
    btn.disabled = false;
    btn.textContent = 'Qeydiyyatdan keç';
  } else {
    // Phone-u profiles-a əlavə et
    if (data.user) {
      await db.from('profiles').update({ phone, full_name: firstName + ' ' + lastName })
        .eq('id', data.user.id);
    }
    document.getElementById('pendingNotice').style.display = 'block';
    btn.style.display = 'none';
    showSuccess('Qeydiyyat uğurludur! Admin təsdiqini gözləyin.');
  }
}

async function doGoogleLogin() {
  await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/index.html' }
  });
}

async function forgotPassword() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showError('E-poçtunuzu daxil edib "Şifrəni unutmuşsunuz?" klikləyin.'); return; }
  const { error } = await db.auth.resetPasswordForEmail(email);
  if (!error) showSuccess('Şifrə sıfırlama linki e-poçtunuza göndərildi.');
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
